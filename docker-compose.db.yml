version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: track_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: track_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_track:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d track_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_track:
    name: track_pgdata
